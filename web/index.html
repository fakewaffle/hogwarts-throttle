<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Hogwarts Throttle</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="offline">
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-whistle" viewBox="0 0 48 48"><path d="M4 17a3 3 0 0 1 3-3h22v.2A13 13 0 1 1 17 28V24H7a3 3 0 0 1-3-3z" fill="currentColor"/><circle cx="29" cy="28" r="5" fill="var(--hole)"/><path d="M34 9l4-5M39 14l6-2M28 7l-1-6" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></symbol>
    <symbol id="i-bell" viewBox="0 0 48 48"><path d="M24 4a3 3 0 0 1 3 3v2.4C34 11 38 17 38 24v8l4 5v2H6v-2l4-5v-8c0-7 4-13 11-14.6V7a3 3 0 0 1 3-3z" fill="currentColor"/><circle cx="24" cy="43" r="4" fill="currentColor"/></symbol>
    <symbol id="i-lamp" viewBox="0 0 48 48"><rect x="17" y="2" width="14" height="5" rx="2" fill="currentColor"/><path d="M13 9h22l3 6v18l-3 5H13l-3-5V15z" fill="currentColor"/><path d="M16 15h16v17H16z" fill="var(--hole)"/><path d="M24 18c3 3 4 6 0 11-4-5-3-8 0-11z" fill="currentColor"/><rect x="14" y="40" width="20" height="5" rx="2" fill="currentColor"/></symbol>
    <symbol id="i-smoke" viewBox="0 0 48 48"><path d="M8 30h14l-2 6h2v8H8v-8h2z" fill="currentColor"/><circle cx="16" cy="22" r="6" fill="currentColor"/><circle cx="25" cy="15" r="7.5" fill="currentColor"/><circle cx="37" cy="10" r="9" fill="currentColor"/></symbol>
    <symbol id="i-talk" viewBox="0 0 48 48"><path d="M8 6h32a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4H22l-10 9v-9H8a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4z" fill="currentColor"/><path d="M13 16h22M13 24h15" stroke="var(--hole)" stroke-width="4" stroke-linecap="round"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 48 48"><path d="M6 24L24 8v10h18v12H24v10z" fill="currentColor"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 48 48"><path d="M6 18h8l12-10v32L14 30H6z" fill="currentColor"/><path d="M32 17a10 10 0 0 1 0 14M37 12a17 17 0 0 1 0 24" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="i-engine" viewBox="0 0 64 40"><path d="M6 8h14v4h-4v8h6V6h-3V2h16v4h-3v14h14V12h-3V8h12v4h-3v8l6 4v6H2V20h6v-8H6z" fill="currentColor"/><circle cx="14" cy="32" r="6" fill="currentColor" stroke="var(--hole)" stroke-width="2"/><circle cx="30" cy="32" r="6" fill="currentColor" stroke="var(--hole)" stroke-width="2"/><circle cx="46" cy="32" r="6" fill="currentColor" stroke="var(--hole)" stroke-width="2"/><path d="M56 30l6 8H52z" fill="currentColor"/></symbol>
  </svg>

  <header>
    <div class="brand">
      <svg class="emblem" aria-hidden="true"><use href="#i-engine"/></svg>
      <div>
        <h1>Hogwarts Express</h1>
        <p class="kicker">Driver's cab &middot; Steam railway</p>
      </div>
    </div>
    <div id="status" class="status off"><span class="dot"></span><span id="status-text">Looking for the train…</span></div>
  </header>

  <main>
    <section class="lever">
      <span class="lever-label">Full steam</span>
      <div id="track" class="track" aria-label="Speed">
        <div class="groove"><div id="fill" class="fill"></div></div>
        <div id="thumb" class="thumb"><span></span></div>
      </div>
      <span class="lever-label">Stopped</span>
    </section>

    <section class="cab">
      <div class="gauge">
        <svg viewBox="0 0 200 172" aria-hidden="true">
          <circle cx="100" cy="100" r="92" class="g-rim"/>
          <circle cx="100" cy="100" r="84" class="g-face"/>
          <path id="redline" class="g-red"/>
          <g id="ticks"></g>
          <g id="needle" class="g-needle"><path d="M96 104 L100 26 L104 104 Z"/><circle cx="100" cy="100" r="9"/></g>
          <circle cx="100" cy="100" r="3.5" class="g-pin"/>
        </svg>
        <div class="readout"><span id="speed">0%</span><small>speed</small></div>
      </div>
      <div class="direction">
        <button id="reverse" class="dir rev"><svg><use href="#i-arrow"/></svg>Back</button>
        <button id="forward" class="dir fwd">Forward<svg><use href="#i-arrow"/></svg></button>
      </div>
      <div class="volume">
        <button id="volume-down" class="vol" aria-label="Quieter">−</button>
        <div class="vol-meter">
          <svg><use href="#i-speaker"/></svg>
          <div id="volume" class="pips"></div>
        </div>
        <button id="volume-up" class="vol" aria-label="Louder">+</button>
      </div>
    </section>

    <section class="controls">
      <button id="stop" class="stop"><span class="octagon"><span>STOP</span></span></button>
      <div class="tiles">
        <button id="horn" class="tile horn"><svg><use href="#i-whistle"/></svg><span class="name">Whistle</span><span class="hint">Press &amp; hold</span></button>
        <button id="bell" class="tile toggle"><svg><use href="#i-bell"/></svg><span class="name">Bell</span><span class="lamp"></span></button>
        <button id="lights" class="tile toggle"><svg><use href="#i-lamp"/></svg><span class="name">Lights</span><span class="lamp"></span></button>
        <button id="dialog" class="tile talk"><svg><use href="#i-talk"/></svg><span class="name">All aboard!</span></button>
        <button id="smoke" class="tile toggle"><svg><use href="#i-smoke"/></svg><span class="name">Smoke</span><span class="lamp"></span></button>
      </div>
    </section>

    <div class="searching" aria-hidden="true">
      <svg><use href="#i-engine"/></svg>
      <strong>Looking for the train…</strong>
      <span>Switch the engine on and put it on the track.<br>A phone using the Lionel app can block it.</span>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
